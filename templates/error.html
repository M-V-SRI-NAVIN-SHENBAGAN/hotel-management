{% extends "base.html" %}
{% block title %}Error {{ code }} - {{ hotel_name }}{% endblock %}
{% block page_title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="card">
    <h2 class="card-title" style="margin-bottom: 8px;">{{ message }}</h2>
    <p class="muted" style="margin-bottom: 14px;">Use the navigation menu or return to the dashboard.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-sm">Back to Dashboard</a>
</div>
{% endblock %}
